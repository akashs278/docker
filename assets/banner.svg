<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2496ED" stop-opacity="0" />
      <stop offset="15%" stop-color="#00D2FF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#2496ED" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2496ED" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Blue Radial Glow Filter -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Background Container -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Radial Blue Glow behind Logo -->
  <circle cx="600" cy="95" r="160" fill="#2496ED" opacity="0.16" filter="url(#blueGlow)" />

  <!-- Terminal Top Header Bar -->
  <g transform="translate(40, 20)">
    <rect width="1120" height="40" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Window Control Buttons (Red, Yellow, Green) -->
    <circle cx="22" cy="20" r="5.5" fill="#FF5F56"/>
    <circle cx="40" cy="20" r="5.5" fill="#FFBD2E"/>
    <circle cx="58" cy="20" r="5.5" fill="#27C93F"/>
    
    <!-- Terminal Prompt Text -->
    <text x="84" y="24" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI Mono', monospace" font-size="13" font-weight="600" fill="#38BDF8">
      akash@docker:<tspan fill="#94A3B8">~/docker-course</tspan> <tspan fill="#38BDF8">(main)</tspan>
    </text>

    <!-- Perfectly Aligned Top-Right Status Badge -->
    <g transform="translate(945, 7)">
      <rect width="160" height="26" rx="13" fill="#131F37" stroke="#2496ED" stroke-opacity="0.6" stroke-width="1.2"/>
      <circle cx="16" cy="13" r="7" fill="#34D399" opacity="0.25"/>
      <circle cx="16" cy="13" r="4" fill="#34D399"/>
      <text x="30" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="0.6">CONTAINERS: READY</text>
    </g>
  </g>

  <!-- Official Docker Logo & Main Content Stack -->
  <g transform="translate(600, 95)">
    <!-- Official Docker Logo Emblem (Exact Brand Spec Vector) -->
    <g transform="scale(4.2)">
      <g transform="translate(-12, -12)">
        <path fill="#2496ED" d="M13.983 11.078h2.119a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.186v1.887c0 .102.083.185.185.185zm-2.954-5.43h2.118a.186.186 0 00.186-.186V3.574a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185zm0 2.716h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.887c0 .102.082.186.185.186zm-2.93 0h2.12a.186.186 0 00.184-.186V6.29a.185.185 0 00-.185-.185H8.1a.185.185 0 00-.185.185v1.887c0 .102.083.186.185.186zm0 2.714h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186H8.1a.185.185 0 00-.185.186v1.887c0 .102.083.185.185.185zm-2.964 0h2.119a.186.186 0 00.185-.185V9.006a.185.185 0 00-.185-.186h-2.119a.186.186 0 00-.186.186v1.887c0 .102.084.185.186.185zm0-2.714h2.119a.186.186 0 00.185-.186V6.29a.185.185 0 00-.185-.185h-2.119a.186.186 0 00-.186.185v1.887c0 .102.084.186.186.186zm-2.92 0h2.12a.185.185 0 00.184-.186V6.29a.185.185 0 00-.184-.185h-2.12a.185.185 0 00-.185.185v1.887c0 .102.083.186.185.186zm0 2.714h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.185.186v1.887c0 .102.083.185.185.185zm-2.946 0h2.119a.186.186 0 00.185-.185V9.006a.186.186 0 00-.185-.186h-2.119a.186.186 0 00-.186.186v1.887c0 .102.084.185.186.185zm24.167 1.082a4.425 4.425 0 00-1.853-.396c-.461 0-.918.067-1.353.195-1.127.332-2.126.967-3.153 1.54-1.282.715-2.613 1.41-4.04 1.705a10.87 10.87 0 01-2.222.227c-3.14 0-6.17-.983-8.815-2.684a12.7 12.7 0 01-1.748-1.34c-.382-.35-.863-.64-1.378-.714-.492-.07-.992.072-1.393.364-.496.362-.806.917-.905 1.516-.145.88.163 1.768.742 2.43 1.83 2.1 4.54 3.4 7.28 3.96 3.16.64 6.44.42 9.58-.33 3.65-.87 7.15-2.65 10.59-4.39 1.15-.58 2.3-1.17 3.51-1.58.4-.13.82-.23 1.25-.23a.96.96 0 01.76.32c.16.2.22.46.2.71-.06.72-.48 1.34-.99 1.82-.41.38-.89.68-1.39.92-.37.18-.76.33-1.16.45-.19.06-.38.15-.49.31-.12.18-.11.41.01.59.12.18.33.27.54.24.58-.09 1.14-.29 1.67-.54.67-.32 1.3-.73 1.85-1.24a5.16 5.16 0 001.37-2.38c.19-.77.06-1.59-.36-2.24z"/>
      </g>
    </g>

    <!-- Main Title -->
    <text y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="0.5" text-anchor="middle">
      Docker &amp; Containerization Guide
    </text>

    <!-- Subtitle -->
    <text y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="0.3" text-anchor="middle">
      From Absolute Beginner to Advanced Production Deployment
    </text>

    <!-- Extended Divider Accent Line -->
    <line x1="-400" y1="130" x2="400" y2="130" stroke="url(#lineGrad)" stroke-width="1.8" />

    <!-- Mathematically Centered Topic Badges Row -->
    <g transform="translate(0, 162)">
      <!-- Badge 1: Terminologies -->
      <g transform="translate(-340, 0)">
        <rect x="-62" y="-14" width="124" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">📦 Terminologies</text>
      </g>

      <!-- Badge 2: Containers -->
      <g transform="translate(-200, 0)">
        <rect x="-56" y="-14" width="112" height="28" rx="14" fill="#1E293B" stroke="#2496ED" stroke-opacity="0.4" stroke-width="1.2"/>
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#60A5FA" text-anchor="middle">🐳 Containers</text>
      </g>

      <!-- Badge 3: Dockerfile -->
      <g transform="translate(-65, 0)">
        <rect x="-54" y="-14" width="108" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">📄 Dockerfile</text>
      </g>

      <!-- Badge 4: Storage -->
      <g transform="translate(65, 0)">
        <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1.2"/>
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#A5B4FC" text-anchor="middle">💾 Storage</text>
      </g>

      <!-- Badge 5: Networks -->
      <g transform="translate(195, 0)">
        <rect x="-54" y="-14" width="108" height="28" rx="14" fill="#1E293B" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2"/>
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6EE7B7" text-anchor="middle">🌐 Networks</text>
      </g>

      <!-- Badge 6: Compose & K8s -->
      <g transform="translate(335, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#F472B6" stroke-opacity="0.4" stroke-width="1.2"/>
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F472B6" text-anchor="middle">🎼 Compose &amp; K8s</text>
      </g>
    </g>
  </g>
</svg>
